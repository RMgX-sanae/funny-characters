:root{--ink:#29312e;--muted:#72786f;--paper:#f5f3eb;--line:#d9ddd0;--green:#315541;--lime:#def59d;--glyph:'OddHan','OddCuneiform','OddEgyptian','OddAlchemy',serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
button,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:4px}
main{max-width:1040px;margin:0 auto;padding:42px 32px 26px}
.topline{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:1px}
.mark{font-family:var(--glyph);font-size:24px;background:var(--ink);color:var(--paper);border-radius:8px;width:35px;height:35px;display:grid;place-items:center}
.local{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:6px;height:6px;background:var(--green);border-radius:50%}
.intro{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:40px 0 32px}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);margin:0 0 12px}
h1{font-size:clamp(30px,4.5vw,43px);line-height:1.35;letter-spacing:-1.5px;font-weight:600;margin:0 0 12px}
h1 span{color:var(--green)}
.description{font-size:14px;line-height:1.8;color:var(--muted);margin:0}
.specimen{font-family:var(--glyph);font-size:55px;letter-spacing:12px;white-space:nowrap;color:var(--green);transform:rotate(-5deg);padding:20px 8px}
.sheet{border:1px solid #d3d8c9;border-radius:18px;background:#fffef9;overflow:hidden;box-shadow:0 9px 0 -6px #e4e7da,0 16px 0 -12px #e4e7da}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid #eaecdf;background:#fbfcf4;font-size:13px}
.sheet-label{font-weight:600;display:flex;align-items:center;gap:8px}
.tag{background:var(--lime);color:var(--green);font-size:10px;border-radius:4px;padding:3px 6px;font-weight:600;letter-spacing:.7px}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.editor-wrap{position:relative}
textarea{display:block;width:100%;min-height:265px;resize:vertical;border:0;outline:0;background:transparent;color:var(--ink);padding:24px;font-family:var(--glyph);font-size:38px;line-height:1.65;letter-spacing:3px;overflow-wrap:anywhere;caret-color:var(--green)}
textarea:focus{box-shadow:inset 3px 0 0 var(--green)}
#empty{pointer-events:none;position:absolute;inset:28px 24px auto;color:#979d90;font-size:20px;line-height:1.6}
#empty small{display:block;margin-top:12px;font-size:13px;letter-spacing:0;color:var(--muted)}
[hidden]{display:none!important}
.sheet-bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:18px 24px;border-top:1px solid #eaecdf}
.hint{font-size:12px;color:var(--muted);line-height:1.8}
kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:2px 5px;background:#f6f7ef;color:#515c50;margin-right:3px}
.actions{display:flex;align-items:center;gap:12px}
button{border:0;border-radius:9px;padding:12px 19px;font-size:13px;font-weight:500;min-height:44px;transition:background .15s}
#clear{color:#63705f;background:#f0f2e8}
#clear:hover{background:#e4e8d8}
#copy{background:var(--green);color:#fff;min-width:114px;display:flex;align-items:center;justify-content:center;gap:8px}
#copy:hover{background:#234632}
button:disabled{opacity:.4;cursor:default}
.copy-icon{width:13px;height:14px;border:1px solid currentColor;border-radius:2px;position:relative;display:inline-block}

<main>
  <header class="topline">
    <div class="brand"><span class="mark" aria-hidden="true">㐂</span> 怪字输入法</div>
    <span class="local"><span class="dot" aria-hidden="true"></span> 离线可用</span>
  </header>
  <section class="intro" aria-labelledby="title">
    <div>
      <p class="eyebrow">TYPE SOMETHING. MEAN NOTHING.</p>
      <h1 id="title">随便敲，<br><span>认真乱写。</span></h1>
      <p class="description" id="instructions">每输入一个字，随机冒出一个怪字。<br>写完直接复制，让同学慢慢破译。</p>
    </div>
    <div class="specimen" aria-hidden="true">𒆎㐂𓀠</div>
  </section>
  <section class="sheet" aria-label="随机字符输入区">
    <div class="sheet-head">
      <label class="sheet-label" for="editor">你的神秘发言 <span class="tag">随机</span></label>
      <span id="count">0 字</span>
    </div>
    <div class="editor-wrap">
      <textarea id="editor" aria-describedby="instructions typing-hint" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      <div id="empty" aria-hidden="true">点这里，随便敲点什么…<small>生僻汉字 · 楔形文字 · 古埃及小人 · 炼金术符号</small></div>
    </div>
    <div class="sheet-bottom">
      <div class="hint" id="typing-hint"><kbd>空格</kbd> 和 <kbd>Enter</kbd> 照常<br>中文输入法也能用，选字后变成怪字</div>
      <div class="actions">
        <button type="button" id="clear" disabled>清空</button>
        <button type="button" id="copy" disabled><span class="copy-icon" aria-hidden="true"></span><span id="copy-label">复制全部</span></button>
      </div>
    </div>
  </section>
  <div class="under">
    <p id="status" role="status" aria-live="polite">键盘准备好了，开始胡说吧。</p>
    <p class="note">随机拼字，不负责翻译。<br>同学那边若显示方框，是对方设备缺少相应字体。</p>
  </div>
  <footer class="footer"><span>一本正经的乱码制造机</span><span>只在本页生效 · 不上传输入内容</span></footer>
</main>

const characters = Array.from("㐁㐂㐃㐄㐅㐆㐌㐖㐜㐡㐤㐧㐨㐩㐪㐫㐬㐮㐯㐰㐱㐲㑋㑌㑑㑗㒀㒁㒊㒓㒘㓀㔾㕕㖃㗊㗑㘋㘚㙓㚘㚡㜈㜺㝋㞢㟲㠭㡭㣌㥯㦛㧀㧥㨻㩳㩻㫃㬎㭁㮇㯤㰘㱃㲋㳄㴇㵘㶫㷋㸚㹜㺯㻞㼌㽓㾕㿙䀀䀋䁇䂀䃀䄫䆐䇎䈉䉢䊎䋛䌖䍃䎛䏿䐁䑄䒑䓙䔧䕥䖇䗍䘎䙁䚐䛐䜌䝁䞓䟴䠭䡀䢉䣐䤌䥐䦕䧢䨻䩁䪞䫄䬘䭥䮛䯤䰕䱎䲜䳩䴒䵷䶊𒀀𒀁𒀂𒀃𒀄𒀅𒀆𒀇𒀈𒀉𒀊𒀋𒀌𒀍𒀎𒀏𒀐𒀑𒀒𒀓𒀔𒀕𒀖𒀗𒀘𒀙𒀚𒀛𒀜𒀝𒀞𒀟𒀠𒀡𒀢𒀣𒀤𒀥𒀦𒀧𒀨𒀩𒀪𒀫𒀬𒀭𒀮𒀯𒀰𒀱𒀲𒀳𒀴𒀵𒀶𒀷𒀸𒀹𒀺𒀻𒀼𒀽𒀾𒀿𒁀𒁃𒁄𒁈𒁋𒁍𒁏𒁒𒁔𒁖𒁛𒁜𒁟𒁢𒁨𒁫𒁯𒁶𒁷𒂀𒂃𒂇𒂌𒂍𒂎𒂐𒂓𒂕𒂙𒂛𒂜𒂞𒂠𒂤𒂧𒂩𒂪𒂬𒂭𒂮𒂯𒃂𒃄𒃈𒃍𒃔𒃥𒃱𒃲𒃴𒄄𒄆𒄋𒄍𒄞𒄨𒄯𒄰𒅄𒅆𒅈𒅌𒅒𒅙𒅜𒅡𒅤𒅥𒅪𒅱𒆎𒆏𒆑𒆙𒆜𒆠𒆤𒆥𒆪𒆳𒇇𒇋𒇓𒇟𒇥𒇯𒇷𒈙𒈞𒈪𒈰𒉌𒉭𒊊𒊹𒋃𒋛𒋡𒋰𒌋𒌕𒌳𒌷𒍑𒍣𓀀𓀁𓀂𓀃𓀄𓀅𓀆𓀇𓀈𓀉𓀊𓀋𓀌𓀍𓀎𓀏𓀐𓀑𓀒𓀓𓀔𓀕𓀖𓀗𓀘𓀙𓀚𓀛𓀜𓀝𓀞𓀟𓀠𓀡𓀢𓀣𓀤𓀥𓀦𓀧𓀨𓀩𓀪𓀫𓀬𓀭𓀮𓀯𓀰𓀱𓀲𓀳𓀴𓀵𓀶𓀷𓀸𓀹𓀺𓀻𓀼𓀽𓀾𓀿𓁀𓁁𓁂𓁃𓁄𓁅𓁆𓁇𓁈𓁉𓁊𓁋𓁌𓁍𓁎𓁏𓁐𓁑𓁒𓁓𓁔𓁕𓁖𓁗𓁘𓁙𓁚𓁛𓁜𓁝𓁞𓁟🜀🜁🜂🜃🜄🜅🜆🜇🜈🜉🜊🜋🜌🜍🜎🜏🜐🜑🜒🜓🜔🜕🜖🜗🜘🜙🜚🜛🜜🜝🜞🜟🜠🜡🜢🜣🜤🜥🜦🜧🜨🜩🜪🜫🜬🜭🜮🜯🜰🜱🜲🜳🜴🜵🜶🜷🜸🜹🜺🜻🜼🜽🜾🜿🝀🝁🝂🝃🝄🝅🝆🝇🝈🝉🝊🝋🝌🝍🝎🝏🝐🝑🝒🝓🝔🝕🝖🝗🝘🝙🝚🝛🝜🝝🝞🝟🝠🝡🝢🝣🝤🝥🝦🝧🝨🝩🝪🝫🝬🝭🝮🝯🝰🝱🝲🝳");
const editor = document.getElementById('editor');
const copy = document.getElementById('copy');
const clear = document.getElementById('clear');
const status = document.getElementById('status');
let value = '', composing = false, lastCharacter = '', noticeTimer;
const history = [{value:'', caret:0}];
let historyIndex = 0;

function randomCharacter() {
  let character;
  do { character = characters[Math.floor(Math.random() * characters.length)]; }
  while (character === lastCharacter);
  lastCharacter = character;
  return character;
}
function refresh() {
  document.getElementById('count').textContent = Array.from(value).filter(c => !/\s/u.test(c)).length + ' 字';
  document.getElementById('empty').hidden = !!editor.value;
  copy.disabled = clear.disabled = !value.length || composing;
}
function remember() {
  value = editor.value;
  if (history[historyIndex].value !== value) {
    history.splice(historyIndex + 1);
    history.push({value, caret:editor.selectionStart});
    if (history.length > 100) history.shift();
    historyIndex = history.length - 1;
  }
  refresh();
}
function convertInput() {
  const raw = editor.value;
  if (raw === value) { refresh(); return; }
  const before = Array.from(value), after = Array.from(raw);
  let start = 0, endBefore = before.length, endAfter = after.length;
  while (start < endBefore && start < endAfter && before[start] === after[start]) start++;
  while (endBefore > start && endAfter > start && before[endBefore - 1] === after[endAfter - 1]) { endBefore--; endAfter--; }
  const from = after.slice(0, start).join('').length;
  const to = after.slice(0, endAfter).join('').length;
  const text = after.slice(start, endAfter).map(c => /\s/u.test(c) ? c : randomCharacter()).join('');
  editor.setRangeText(text, from, to, 'end');
  remember();
}
editor.addEventListener('compositionstart', () => { composing = true; refresh(); });
editor.addEventListener('compositionend', () => { composing = false; convertInput(); });
editor.addEventListener('input', event => {
  document.getElementById('empty').hidden = !!editor.value;
  if (composing || event.isComposing) return;
  if (event.inputType && event.inputType.startsWith('delete')) remember();
  else convertInput();
});
function restore(step) {
  historyIndex = Math.max(0, Math.min(history.length - 1, historyIndex + step));
  value = editor.value = history[historyIndex].value;
  editor.setSelectionRange(history[historyIndex].caret, history[historyIndex].caret);
  refresh();
}
editor.addEventListener('keydown', event => {
  if (composing || event.isComposing) return;
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z') {
    event.preventDefault(); restore(event.shiftKey ? 1 : -1);
  }
});
editor.addEventListener('beforeinput', event => {
  if (event.inputType === 'historyUndo' || event.inputType === 'historyRedo') {
    event.preventDefault(); restore(event.inputType === 'historyUndo' ? -1 : 1);
  }
});
function notice(message) {
  clearTimeout(noticeTimer);
  status.textContent = message;
  noticeTimer = setTimeout(() => { status.textContent = '键盘准备好了，继续胡说吧。'; }, 3500);
}
clear.addEventListener('click', () => {
  editor.value = ''; remember(); editor.focus(); notice('清空了，可以重新胡说。');
});
copy.addEventListener('click', async () => {
  const text = value;
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch {}
  if (!copied) {
    const selection = [editor.selectionStart, editor.selectionEnd];
    editor.focus(); editor.select();
    try { copied = document.execCommand('copy'); } catch {}
    if (copied) editor.setSelectionRange(...selection);
  }
  notice(copied ? '复制好了，发给同学猜猜看。' : '文字已选中，按 ⌘C 或 Ctrl+C 复制。');
  editor.focus({preventScroll:true});
});
refresh();
editor.focus({preventScroll:true});
